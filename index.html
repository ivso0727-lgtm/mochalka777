
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SPONGE ASMR</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#b8b4ad;font-family:Arial,sans-serif}
canvas{display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;color:white}
.panel{background:#222b30d9;border:1px solid #ffffff50;backdrop-filter:blur(14px);border-radius:16px;padding:12px 17px;box-shadow:0 8px 25px #0003}
.top{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-weight:900;letter-spacing:2px;font-size:17px}
.score{font-size:14px;margin-top:5px}
.meter{width:min(36vw,300px);text-align:center}
.meter b{font-size:12px}
.track{height:11px;background:#ffffff38;border-radius:20px;margin-top:8px;overflow:hidden}
#bar{height:100%;width:0;background:linear-gradient(90deg,#a4eaff,#fff);transition:width .15s}
button{pointer-events:auto;background:#253139e8;color:white;border:1px solid #ffffff70;border-radius:13px;padding:12px 15px;font-size:14px}
#help{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);padding:13px 20px;border-radius:30px;background:#202a30e8;border:1px solid #ffffff55;white-space:nowrap;font-size:13px}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#c3beb5;color:#333;font-size:19px;z-index:10}
#sound{position:absolute;right:16px;bottom:75px}
@media(max-width:600px){
 .top{top:9px;left:8px;right:8px}
 .panel{padding:9px 10px}
 .logo{font-size:12px}
 .score{font-size:11px}
 .meter{width:34vw}
 .meter b{font-size:10px}
 button{padding:9px;font-size:11px}
 #help{bottom:12px;font-size:11px;padding:11px 14px}
}
</style>
</head>
<body>
<div id="loading">Подготавливаем ванную комнату...</div>
<div id="ui">
 <div class="top">
  <div class="panel">
   <div class="logo">SPONGE ASMR</div>
   <div class="score">⭐ <span id="score">0</span></div>
  </div>
  <div class="panel meter">
   <b>ПЕНА · <span id="percent">0</span>%</b>
   <div class="track"><div id="bar"></div></div>
  </div>
  <button id="reset">↻ Сброс</button>
 </div>
 <button id="sound">🔊 Звук</button>
 <div id="help">Зажми губку, чтобы начать</div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from "three";

const $=id=>document.getElementById(id);
let scene,camera,renderer,clock;
let sponge,spongeGroup,water;
let foam=[],bubbles=[];
let squeezing=false,score=0,foamLevel=0;
let audio=null,soundOn=true,lastSound=0;
let raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();

try{
 init();
 animate();
 $("loading").style.display="none";
}catch(e){
 console.error(e);
 $("loading").textContent="Не удалось загрузить 3D. Проверь интернет и обнови страницу.";
}

function init(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0xbebbb5);
 scene.fog=new THREE.Fog(0xbebbb5,13,28);

 camera=new THREE.PerspectiveCamera(37,innerWidth/innerHeight,.1,100);
 camera.position.set(4.7,7.6,8.6);
 camera.lookAt(0,1.05,0);

 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.25;
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 document.body.appendChild(renderer.domElement);

 scene.add(new THREE.HemisphereLight(0xffffff,0x68605a,2.1));

 const key=new THREE.DirectionalLight(0xfff1df,3.5);
 key.position.set(-4,9,5);
 key.castShadow=true;
 key.shadow.mapSize.set(2048,2048);
 key.shadow.camera.left=-8;
 key.shadow.camera.right=8;
 key.shadow.camera.top=8;
 key.shadow.camera.bottom=-8;
 scene.add(key);

 const fill=new THREE.DirectionalLight(0xdceeff,2.3);
 fill.position.set(5,6,-5);
 scene.add(fill);

 const wallMat=new THREE.MeshStandardMaterial({color:0xd6d2c9,roughness:.85});
 const wall=new THREE.Mesh(new THREE.PlaneGeometry(30,15),wallMat);
 wall.position.set(0,5,-4.3);
 scene.add(wall);

 // Плитка на стене
 const tileMat=new THREE.MeshStandardMaterial({color:0xc3bfb6,roughness:.8});
 for(let x=-5;x<=5;x+=1.25){
  for(let y=2.2;y<=8;y+=1.25){
   const tile=new THREE.Mesh(new THREE.BoxGeometry(1.22,1.22,.025),tileMat);
   tile.position.set(x,y,-4.18);
   scene.add(tile);
  }
 }

 // Пол ванной
 const floor=new THREE.Mesh(
  new THREE.PlaneGeometry(100,100),
  new THREE.MeshStandardMaterial({color:0x9e9991,roughness:.7})
 );
 floor.rotation.x=-Math.PI/2;
 floor.position.y=-.2;
 floor.receiveShadow=true;
 scene.add(floor);

 createCounter();
 createSink();
 createFaucet();
 createSponge();
 createFoam();
 createAccessories();

 clock=new THREE.Clock();

 window.addEventListener("resize",resize);
 renderer.domElement.addEventListener("pointerdown",onPointerDown);
 window.addEventListener("pointerup",()=>squeezing=false);
 window.addEventListener("pointercancel",()=>squeezing=false);
 window.addEventListener("blur",()=>squeezing=false);
 $("reset").onclick=reset;
 $("sound").onclick=()=>{
  soundOn=!soundOn;
  $("sound").textContent=soundOn?"🔊 Звук":"🔇 Звук";
 };
}

function mat(color,roughness=.5,metalness=0){
 return new THREE.MeshStandardMaterial({color,roughness,metalness});
}

function createCounter(){
 const stone= new THREE.MeshStandardMaterial({
  color:0xe1ded7,roughness:.28,metalness:.02
 });
 const slab=new THREE.Mesh(new THREE.BoxGeometry(8,.32,6),stone);
 slab.position.set(0,.72,0);
 slab.receiveShadow=true;
 slab.castShadow=true;
 scene.add(slab);

 const cabinet=new THREE.Mesh(
  new THREE.BoxGeometry(7.7,1.5,5.7),
  mat(0x77716a,.58)
 );
 cabinet.position.set(0,-.18,0);
 cabinet.castShadow=true;
 scene.add(cabinet);

 // Фасады тумбы
 for(let x of [-2.8,-.95,.95,2.8]){
  const door=new THREE.Mesh(
   new THREE.BoxGeometry(1.72,1.25,.06),
   mat(0x91877d,.45)
  );
  door.position.set(x,-.17,2.88);
  scene.add(door);

  const handle=new THREE.Mesh(
   new THREE.BoxGeometry(.38,.035,.07),
   mat(0xb9b7b1,.25,.8)
  );
  handle.position.set(x,-.2,2.94);
  scene.add(handle);
 }
}

function createSink(){
 const ceramic=new THREE.MeshPhysicalMaterial({
  color:0xf4f3ef,roughness:.13,metalness:.01,
  clearcoat:1,clearcoatRoughness:.08
 });

 // Настоящая вогнутая форма чаши через профиль вращения
 const profile=[
  new THREE.Vector2(0,.20),
  new THREE.Vector2(.7,.20),
  new THREE.Vector2(1.15,.23),
  new THREE.Vector2(1.55,.34),
  new THREE.Vector2(1.82,.54),
  new THREE.Vector2(2.02,.83),
  new THREE.Vector2(2.16,1.04),
  new THREE.Vector2(2.25,1.08),
  new THREE.Vector2(2.30,1.02),
  new THREE.Vector2(2.25,.92),
  new THREE.Vector2(2.12,.69),
  new THREE.Vector2(1.94,.37),
  new THREE.Vector2(1.7,.12)
 ];
 const bowl=new THREE.Mesh(new THREE.LatheGeometry(profile,128),ceramic);
 bowl.position.y=.82;
 bowl.castShadow=true;
 bowl.receiveShadow=true;
 scene.add(bowl);

 // Бортик раковины
 const rim=new THREE.Mesh(
  new THREE.TorusGeometry(1,.055,20,128),
  ceramic
 );
 rim.rotation.x=Math.PI/2;
 rim.scale.set(2.26,1.65,1);
 rim.position.y=1.91;
 scene.add(rim);

 // Вода на дне
 water=new THREE.Mesh(
  new THREE.CircleGeometry(1,96),
  new THREE.MeshPhysicalMaterial({
   color:0x9bd9e9,transparent:true,opacity:.55,
   roughness:.07,metalness:.06,clearcoat:1,
   side:THREE.DoubleSide
  })
 );
 water.rotation.x=-Math.PI/2;
 water.scale.set(1.65,1.18,1);
 water.position.set(0,1.08,0);
 scene.add(water);

 // Слив
 const chrome=mat(0x92999c,.19,.9);
 const drain=new THREE.Mesh(new THREE.CylinderGeometry(.24,.24,.04,48),chrome);
 drain.position.set(.7,1.10,.35);
 scene.add(drain);

 const dark=mat(0x31383a,.28,.8);
 for(let i=0;i<12;i++){
  const a=i/12*Math.PI*2;
  const hole=new THREE.Mesh(new THREE.CylinderGeometry(.018,.018,.05,12),dark);
  hole.position.set(.7+Math.cos(a)*.16,1.13,.35+Math.sin(a)*.16);
  scene.add(hole);
 }
}

function rod(a,b,r,material){
 const dir=new THREE.Vector3().subVectors(b,a);
 const mesh=new THREE.Mesh(
  new THREE.CylinderGeometry(r,r,dir.length(),32),
  material
 );
 mesh.position.copy(a).add(b).multiplyScalar(.5);
 mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
 mesh.castShadow=true;
 scene.add(mesh);
 return mesh;
}

function createFaucet(){
 const chrome=new THREE.MeshStandardMaterial({
  color:0xd5dcdf,metalness:.96,roughness:.12
 });

 const base=new THREE.Mesh(new THREE.CylinderGeometry(.28,.32,.13,48),chrome);
 base.position.set(0,1.02,-2.2);
 scene.add(base);

 rod(new THREE.Vector3(0,1.05,-2.2),new THREE.Vector3(0,2.45,-2.2),.13,chrome);

 // Изогнутый излив
 const bend=new THREE.Mesh(new THREE.TorusGeometry(.52,.13,24,64,Math.PI/2),chrome);
 bend.rotation.set(Math.PI/2,0,Math.PI);
 bend.position.set(.52,2.45,-2.2);
 scene.add(bend);

 rod(new THREE.Vector3(.52,2.45,-1.68),new THREE.Vector3(.52,1.95,-1.68),.13,chrome);

 const nozzle=new THREE.Mesh(new THREE.CylinderGeometry(.13,.105,.17,32),mat(0x7d8588,.18,.9));
 nozzle.position.set(.52,1.89,-1.68);
 scene.add(nozzle);

 // Ручки
 for(const x of [-.48,.48]){
  const handle=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.34,24),chrome);
  handle.position.set(x,1.15,-2.2);
  handle.rotation.z=.35;
  scene.add(handle);
 }
}

function spongeTexture(){
 const c=document.createElement("canvas");
 c.width=c.height=512;
 const ctx=c.getContext("2d");
 ctx.fillStyle="#eab03c";
 ctx.fillRect(0,0,512,512);

 for(let i=0;i<21000;i++){
  const x=Math.random()*512;
  const y=Math.random()*512;
  const r=.7+Math.random()*3.5;
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=Math.random()>.5?"#ffe38a":"#995919";
  ctx.globalAlpha=.12+Math.random()*.32;
  ctx.fill();
 }
 ctx.globalAlpha=1;
 const texture=new THREE.CanvasTexture(c);
 texture.colorSpace=THREE.SRGBColorSpace;
 return texture;
}

function createSponge(){
 spongeGroup=new THREE.Group();
 spongeGroup.position.set(0,1.48,.05);
 spongeGroup.rotation.set(-.12,-.2,-.04);
 scene.add(spongeGroup);

 const texture=spongeTexture();
 const material=new THREE.MeshStandardMaterial({
  map:texture,bumpMap:texture,bumpScale:.07,
  roughness:.98
 });

 const geo=new THREE.BoxGeometry(2.25,.64,1.35,28,14,18);
 sponge=new THREE.Mesh(geo,material);
 sponge.castShadow=true;
 sponge.receiveShadow=true;
 spongeGroup.add(sponge);

 const scrubber=new THREE.Mesh(
  new THREE.BoxGeometry(2.18,.11,1.30,16,2,12),
  mat(0x357b4d,.98)
 );
 scrubber.position.y=-.335;
 scrubber.castShadow=true;
 sponge.add(scrubber);
}

function createFoam(){
 const white=new THREE.MeshPhysicalMaterial({
  color:0xffffff,roughness:.17,clearcoat:1,
  clearcoatRoughness:.08
 });
 const pearl=new THREE.MeshPhysicalMaterial({
  color:0xe7faff,roughness:.08,transparent:true,
  opacity:.76,clearcoat:1
 });
 const geometry=new THREE.SphereGeometry(1,20,16);

 for(let i=0;i<240;i++){
  const ball=new THREE.Mesh(geometry,i%5===0?pearl:white);
  const s=.10+Math.random()*.19;
  ball.scale.set(s,s*.78,s);
  ball.visible=false;
  ball.castShadow=true;
  scene.add(ball);
  foam.push(ball);
 }
}

function createAccessories(){
 // Дозатор мыла
 const glass=new THREE.MeshPhysicalMaterial({
  color:0xd8e4e0,transparent:true,opacity:.65,
  roughness:.12,clearcoat:1
 });
 const bottle=new THREE.Mesh(new THREE.CylinderGeometry(.22,.25,.72,40),glass);
 bottle.position.set(-2.8,1.2,-1.2);
 scene.add(bottle);

 const pump=new THREE.Mesh(new THREE.CylinderGeometry(.055,.075,.23,20),mat(0xb8aa96,.22,.7));
 pump.position.set(-2.8,1.68,-1.2);
 scene.add(pump);

 // Свернутое полотенце
 const towel=new THREE.Mesh(
  new THREE.BoxGeometry(.95,.09,.58),
  mat(0xe9e2d8,.95)
 );
 towel.position.set(3.05,.95,-1.1);
 towel.rotation.y=-.3;
 scene.add(towel);
}

function onPointerDown(event){
 if(event.target.closest("button"))return;
 pointer.x=(event.clientX/innerWidth)*2-1;
 pointer.y=-(event.clientY/innerHeight)*2+1;
 raycaster.setFromCamera(pointer,camera);
 const hits=raycaster.intersectObject(sponge,true);
 if(hits.length){
  squeezing=true;
  $("help").textContent="🧽 Сжимай губку — создавай пену!";
  playSound();
 }
}

function playSound(){
 if(!soundOn)return;
 try{
  if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();
  if(audio.state==="suspended")audio.resume();
  const buffer=audio.createBuffer(1,audio.sampleRate*.2,audio.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++){
   data[i]=(Math.random()*2-1)*(1-i/data.length);
  }
  const source=audio.createBufferSource();
  const filter=audio.createBiquadFilter();
  const gain=audio.createGain();
  source.buffer=buffer;
  filter.type="lowpass";
  filter.frequency.value=650;
  gain.gain.value=.13;
  source.connect(filter);
  filter.connect(gain);
  gain.connect(audio.destination);
  source.start();
 }catch(e){}
}

function makeBubble(){
 const material=new THREE.MeshPhysicalMaterial({
  color:0xe6faff,transparent:true,opacity:.52,
  roughness:.04,clearcoat:1
 });
 const b=new THREE.Mesh(new THREE.SphereGeometry(1,18,14),material);
 const size=.035+Math.random()*.09;
 b.scale.set(size,size,size);
 b.position.set((Math.random()-.5)*2.4,1.3+Math.random()*.4,(Math.random()-.5)*1.3);
 b.userData={speed:.5+Math.random(),drift:(Math.random()-.5)*.5};
 scene.add(b);
 bubbles.push(b);
}

function updateFoam(){
 const count=Math.floor(foamLevel/100*foam.length);
 foam.forEach((b,i)=>{
  b.visible=i<count;
  if(i<count){
   const a=i*2.399;
   const r=.4+(i%17)*.095;
   b.position.x=Math.cos(a)*r;
   b.position.z=Math.sin(a)*r*.66;
   b.position.y=1.13+(i%5)*.045;
  }
 });
}

function reset(){
 score=0;
 foamLevel=0;
 bubbles.forEach(b=>scene.remove(b));
 bubbles=[];
 updateUI();
 updateFoam();
}

function updateUI(){
 $("score").textContent=score;
 $("percent").textContent=Math.round(foamLevel);
 $("bar").style.width=foamLevel+"%";
}

function resize(){
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
}

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 const t=clock.elapsedTime;

 if(sponge){
  sponge.scale.y=THREE.MathUtils.lerp(sponge.scale.y,squeezing?.57:1,squeezing?.24:.1);
  sponge.scale.x=THREE.MathUtils.lerp(sponge.scale.x,squeezing?1.07:1,.12);
  spongeGroup.position.y=1.48+(squeezing?-.10:0)+Math.sin(t*2)*.009;
  spongeGroup.rotation.z=THREE.MathUtils.lerp(
   spongeGroup.rotation.z,squeezing?Math.sin(t*13)*.035:-.04,.12
  );
 }

 if(squeezing){
  foamLevel=Math.min(100,foamLevel+dt*10);
  score+=Math.round(dt*20);
  if(Math.random()<dt*24)makeBubble();
  if(t-lastSound>.5){playSound();lastSound=t;}
 }else{
  foamLevel=Math.max(0,foamLevel-dt*.1);
 }

 for(let i=bubbles.length-1;i>=0;i--){
  const b=bubbles[i];
  b.position.y+=b.userData.speed*dt;
  b.position.x+=Math.sin(t*2+i)*dt*b.userData.drift;
  if(b.position.y>4.5){
   scene.remove(b);
   bubbles.splice(i,1);
  }
 }

 water.position.y=1.08+Math.sin(t*1.8)*.008;
 updateFoam();
 updateUI();
 renderer.render(scene,camera);
}
</script>
</body>
</html>
